name: Perbarui Data Saham

on:
  schedule:
    # Setiap 30 menit, jam 02:00-08:30 UTC = 09:00-15:30 WIB (jam bursa IHSG)
    # Sesuaikan jadwal ini sesuai kebutuhan. Cron GitHub Actions pakai UTC.
    - cron: "*/30 2-8 * * 1-5"
  workflow_dispatch: {}   # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Jalankan fetch_data.py
        run: python scripts/fetch_data.py

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --cached --quiet || git commit -m "chore: perbarui data saham otomatis"
          git push
